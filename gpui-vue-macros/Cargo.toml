[package]
name = "gpui-vue-macros"
version = "0.1.0"
edition = "2024"
description = "Compile-time view and Tailwind-like macros for gpui-vue"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
